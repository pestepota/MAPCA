<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAPCA - Map Generator</title>
    <link rel="stylesheet" href="../style/rtmap.css">
</head>

<body>
    <div class="rtmap-layout">
        <div class="config-sidebar">
            <div class="top-bar-rt">
                <h2>GENERATOR</h2>
            </div>

            <div class="config-group">
                <label for="map-seed">Map Seed:</label>
                <input type="text" id="map-seed" placeholder="e.g. 123456">
            </div>

            <div class="config-group">
                <label for="map-size">Map Size:</label>
                <select id="map-size">
                    <option value="small">Small (50x50)</option>
                    <option value="medium">Medium (100x100)</option>
                    <option value="large">Large (200x200)</option>
                </select>
            </div>

            <div class="config-group">
                <label for="terrain-type">Terrain Type:</label>
                <select id="terrain-type">
                    <option value="archipelago">Archipelago</option>
                    <option value="continents">Continents</option>
                    <option value="pangea">Pangea</option>
                </select>
            </div>

            <!-- Pietro, pfv, se for adicionar alguma configuração extra faz no mesmo padrão e adiciona elas numa div em baixo dessa div a seguir-->
            <div class="config-group" id="friend-custom-configs">
                <label for="country-mode">Country Generation:</label>
                <select id="country-mode">
                    <option value="automatic">Automatic</option>
                    <option value="manual">Manual</option>
                </select>

                <div class="config-group" id="automatic-config">
                    <label for="country-count">Number of Countries:</label>
                    <input type="number" id="country-count" min="1" value="15">
                </div>

                <div class="config-group" id="manual-config" hidden>
                    <label>Countries:</label>
                    <div id="country-list"></div>
                    <button type="button" id="add-country-btn">Add Country</button>
                </div>
            </div>

            <button id="generate-btn">Generate Map</button>
            <a href="../index.html">Back</a>
        </div>

        <div class="map-viewport" id="mapViewport">
            <canvas id="mapCanvas"></canvas>
        </div>
    </div>

    <div class="crt-overlay"></div>

    <script type="module" src="../js/app.js"></script>
        <!--version-->
    <footer>
        <p class="version">version 0.00 prealpha</p>
    </footer>
</body>

</html>
