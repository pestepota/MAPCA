<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAPCA - Saved Maps</title>
    <link rel="stylesheet" href="/style/svmap.css">
</head>
<body>
    <div id="logo">
        <h1 class="title">SAVED MAPS<span class="underline">_</span></h1>
    </div>

    <div class="svmap-container">
        <div class="map-grid">

            <!-- Some examples of saved maps-->
            <div class="map-card">
                <h3>Map_001.map</h3>
                <p style="font-size: small;">Size: 50x50 | Biome: Forest</p>
                <div class="map-card-actions">
                    <button>Load</button>
                    <button>Del</button>
                </div>
            </div>
            <div class="map-card">
                <h3>RPG_World_Alpha</h3>
                <p style="font-size: small;">Size: 100x100 | Biome: Archipelago</p>
                <div class="map-card-actions">
                    <button>Load</button>
                    <button>Del</button>
                </div>
            </div>
        </div>
        <div>
            <a href="/index.html" class="back-menu">Back to Menu</a>
        </div>
    </div>

    <div class="crt-overlay"></div>
</body>
</html>
